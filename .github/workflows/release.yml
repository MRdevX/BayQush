name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Version, build APK, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Create baseline tag for existing history
        run: |
          if git tag --list | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git tag v0.0.0 "$(git rev-parse HEAD^)"
          else
            git tag v0.0.0 "$(git rev-parse HEAD)"
          fi
          git push origin v0.0.0

      - name: Install Cocogitto
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          install-only: true

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          previous="$(git describe --tags --abbrev=0)"
          cog bump --auto || true
          current="$(git describe --tags --abbrev=0)"

          if [ "$previous" = "$current" ]; then
            echo "No auto bump from conventional commits; forcing a patch bump"
            cog bump --patch
            current="$(git describe --tags --abbrev=0)"
          fi

          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "Bumped to $current"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bayqush-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bayqush-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/BayQush-${{ steps.bump.outputs.version }}.apk"

      - name: Push release commit and tag
        run: |
          git push
          git push origin "${{ steps.bump.outputs.version }}"

      - name: Generate changelog
        run: cog changelog --at "${{ steps.bump.outputs.version }}" -t full_hash > GITHUB_CHANGELOG.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: ${{ steps.bump.outputs.version }}
          body_path: GITHUB_CHANGELOG.md
          files: dist/BayQush-*.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/bayqush-release.jks"
